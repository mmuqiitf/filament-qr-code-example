name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Publish lazy decoder chunk
        # filament:assets only copies registered single files, never the
        # decoder chunks/ dir, so first camera/upload use would 404 without this.
        run: |
          mkdir -p public/js/mmuqiitf/filament-qr-code/chunks
          cp vendor/mmuqiitf/filament-qr-code/resources/dist/chunks/*.js public/js/mmuqiitf/filament-qr-code/chunks/

      - name: Run CI Checks
        run: composer ci:check

  assets:
    name: Published Filament assets are fresh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Republish Filament assets
        run: php artisan filament:assets

      - name: Fail when published assets are stale
        run: git diff --exit-code -- public/
